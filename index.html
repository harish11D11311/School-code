<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>My School Code</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background: #f2f2f2;
        }

        h1 {
            text-align: center;
        }

        .program {
            background: white;
            padding: 15px;
            margin: 20px 0;
            border-radius: 10px;
        }

        pre {
            background: #222;
            color: white;
            padding: 15px;
            border-radius: 8px;
            overflow-x: auto;
            white-space: pre-wrap;
        }

        button {
            padding: 10px 15px;
            border: none;
            border-radius: 6px;
            background: #222;
            color: white;
            cursor: pointer;
        }

        button:active {
            transform: scale(0.97);
        }
    </style>
</head>

<body>

<h1>📚 My School Code</h1>

<!-- ========================= -->
<!-- ADD YOUR PROGRAMS BELOW   -->
<!-- ========================= -->


<div class="program">
    <h2>Program 1</h2>

    <pre id="program1">PUT YOUR CODE HERE</pre>

    <button onclick="copyCode('program1')">📋 Copy Code</button>
</div>


<div class="program">
    <h2>Program 2</h2>

    <pre id="program2">PUT YOUR CODE HERE</pre>

    <button onclick="copyCode('program2')">📋 Copy Code</button>
</div>
print("hello world")
<script>
function copyCode(id) {
    const code = document.getElementById(id).innerText;

    navigator.clipboard.writeText(code).then(function() {
        alert("✅ Code copied!");
    });
}
</script>

</body>
</html>
