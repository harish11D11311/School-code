<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>My School Code</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            background: #f4f4f4;
        }

        h1 {
            text-align: center;
        }

        .program {
            background: white;
            padding: 15px;
            margin: 20px 0;
            border-radius: 10px;
        }

        pre {
            background: #222;
            color: white;
            padding: 15px;
            overflow-x: auto;
            border-radius: 8px;
        }

        button {
            padding: 10px 15px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            background: #222;
            color: white;
        }
    </style>
</head>

<body>

<h1>📚 My School Code</h1>

<div class="program">
    <h2>Day 1 - Hello World</h2>

    <pre id="code1">print("Hello World")</pre>

    <button onclick="copyCode('code1')">📋 Copy Code</button>
</div>


<div class="program">
    <h2>Day 2 - Calculator</h2>

    <pre id="code2">a = int(input("Enter first number: "))
b = int(input("Enter second number: "))

print("Sum =", a + b)
print("Difference =", a - b)
print("Product =", a * b)</pre>

    <button onclick="copyCode('code2')">📋 Copy Code</button>
</div>


<script>
function copyCode(id) {
    const code = document.getElementById(id).innerText;

    navigator.clipboard.writeText(code);

    alert("Code copied!");
}
</script>

</body>
</html>
